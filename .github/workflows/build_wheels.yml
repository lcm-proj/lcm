name: Build wheels

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  unix:
    name: ${{ matrix.os }} | ${{ matrix.arch }} | ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        arch: [auto, armv7l]
        python: [cp39-*, cp310-*, cp311-*, cp312-*, cp313-*, cp314-*, cp315-*]
        include:
          - os: macos-15
            macos_deployment_target: 15
        exclude:
          - os: ubuntu-24.04
            arch: armv7l
          - os: macos-15
            arch: armv7l

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.python }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_ENVIRONMENT: LCM_DEFAULT_URL=memq://
          CIBW_TEST_COMMAND: "pytest {project}"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  windows-msys:

    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v3
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            git
            make
          pacboy: >-
            toolchain:p
            cmake:p
            glib2:p
            python-pip:p

      - name: Build wheel
        run: pip3 wheel -v .

      - name: Test wheel
        run: |
          pip3 install lcm*.whl --break-system-packages
          python test/python/test_python_module.py

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: '*.whl'

  windows-msvc:
    name: ${{ matrix.runner }} | ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{github.workspace}}\vcpkg-cache
    strategy:
      fail-fast: false
      matrix:
        python: [cp39-*, cp310-*, cp311-*, cp312-*, cp313-*, cp314-*, cp315-*]
        runner: [windows-2022, windows-11-arm]

    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{github.workspace}}\vcpkg-cache
          key: vcpkg-wheel-${{ matrix.runner }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          restore-keys: |
            vcpkg-wheel-${{ matrix.runner }}-${{ hashFiles('vcpkg.json') }}-

      - name: Create cache directory
        run: mkdir ${{env.VCPKG_DEFAULT_BINARY_CACHE}} -Force

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}
          SKBUILD_CMAKE_ARGS: ${{ matrix.runner == 'windows-11-arm' && '--preset=vcpkg-vs-github-2026' || '--preset=vcpkg-vs-github' }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}"

      - name: Save vcpkg binary cache
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}\vcpkg-cache
          key: vcpkg-wheel-${{ matrix.runner }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-windows-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
