name: check_man_pages

on: [push, pull_request]

jobs:
  generate_man_pages:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install help2man libglib2.0-dev

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build ${{env.CMAKE_FLAGS}} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build ${{github.workspace}}/build

      - name: Generate man pages
        run: ${{github.workspace}}/docs/generate_man_pages.sh

      - name: Check result
        run: |
          set -xe
          # We want to fail if the version number changed, but not if only the month changed.
          # Strategy: Extract both removed and added .TH lines, strip out the date field,
          # and compare. If they're identical (only date changed), filter them out.

          # Get added .TH lines and remove the date field (3rd quoted field)
          ADDED_TH=$(git diff | grep -P '^\+\.TH ' | sed -E 's/"(January|February|March|April|May|June|July|August|September|October|November|December) [0-9]+"/"DATE"/g' || true)

          # Get removed .TH lines and remove the date field (3rd quoted field)
          REMOVED_TH=$(git diff | grep -P '^-\.TH ' | sed -E 's/^-/+/; s/"(January|February|March|April|May|June|July|August|September|October|November|December) [0-9]+"/"DATE"/g' || true)

          # Get all other non-.TH changes (added lines that don't start with ++ or +.TH)
          OTHER_CHANGES=$(git diff | grep -P '^\+[^\+]' | grep -Pv '^\+\.TH ' || true)

          # Check if there are .TH lines where more than just the date changed
          if [ "$ADDED_TH" != "$REMOVED_TH" ] || [ -n "$OTHER_CHANGES" ]; then
              echo "Manual pages are out of sync. Please regenerate with 'docs/generate_man_pages.sh' or apply the following diff:"
              git diff | cat
              exit 1
          else
              echo "Only date changes detected in man pages, which is acceptable."
              exit 0
          fi
        shell: bash
