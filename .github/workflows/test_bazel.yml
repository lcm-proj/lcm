name: test_bazel

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  bazel:
    strategy:
      matrix:
        bazel: ['8.0.1', '8.1.0']
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
    - uses: actions/checkout@v4
    - uses: bazel-contrib/setup-bazel@0.13.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
    - name: Test Main
      run: 'bazel test //...'
    - name: Test Example
      working-directory: examples/bazel
      run: 'bazel test //...'
